# Placement policy.
#
# Only the homepage hero carries a semantic class (ap-hero-image) that
# identifies what the slot is for. Every other placeholder slot is generic, and
# the section headings on all four pages are still {{SERVICE_NAME}} and
# {{SECTION_DESCRIPTION}}. An image cannot be assessed for relevance against a
# heading that has no content yet.
#
# So placement runs in two phases:
#   phase 1  hero slots only - unambiguously identifiable, and the most
#            visible image on each page. Also removes the external hot-link to
#            patterns.generatepress.com for those slots.
#   phase 2  section slots - deferred until the approved content package is
#            placed and each card has a real heading to match against.
#
# Run `images --phase 1` for the first, `--phase 2` once content is in.
placement:
  phase_1_roles: [hero]
  phase_2_roles: [section, cta, detail]

# --- Phase 2 placement map ---------------------------------------------------
#
# Each slot is addressed by its GenerateBlocks uniqueId and paired with the
# heading that follows it in the block tree, so an image is matched to the card
# it actually sits above rather than to an ordinal position.
#
# This was only possible AFTER the content pass filled the headings. While the
# cards read {{SERVICE_NAME}}, image relevance could not be assessed at all.
#
# relevance:
#   specific - the image depicts the named pest or the work that service does
#   general  - the image is pest-control work but not specific to that pest.
#              Disclosed rather than presented as a precise match.
placements:
  homepage:
    - {slot: 4a05a449, asset: rural-property-with-detached-garage.webp,           heading: "Residential Pest Control category", relevance: general}
    - {slot: 1b31c10a, asset: exterior-wood-trim-probe-inspection.webp,           heading: "Termite Control",       relevance: specific}
    - {slot: 69f7caa5, asset: roofline-vent-and-utility-penetration.webp,         heading: "Rodent Control",        relevance: specific}
    - {slot: eabd8ffc, asset: mattress-seam-inspection-with-flashlight.webp,        heading: "Bed Bug Control",       relevance: specific}
    - {slot: 93440e95, asset: under-sink-cabinet-flashlight-check.webp,           heading: "Cockroach Control",     relevance: specific}
    - {slot: 6d78a4ca, asset: exterior-perimeter-treatment-along-walkway.webp,    heading: "Ant Control",           relevance: specific}
    - {slot: 990b2750, asset: roof-eave-and-rafter-tails-from-below.webp,         heading: "Bee and Wasp Control",  relevance: specific}
    - {slot: d6a65423, asset: attic-framing-flashlight-inspection.webp,           heading: "Spider Control",        relevance: general}
    - {slot: 5fd80884, asset: technician-inspecting-exterior-foundation-line.webp, heading: "Flea Control",         relevance: general}
    - {slot: af83bb35, asset: lakeside-hero-residential-street-and-hills.webp,    heading: "Mosquito Control",      relevance: general}
    - {slot: e995f4a5, asset: technician-recording-findings-on-clipboard.webp,    heading: "Why Choose",            relevance: specific}
    - {slot: bff42ecb, asset: inspection-tools-on-a-work-surface.webp,            heading: "Our Process",           relevance: specific}
    - {slot: 912e2d10, asset: about-hero-technician-at-service-vehicle.webp,      heading: "Local Pest Conditions", relevance: general}

  location_lakeside:
    - {slot: e666a388, asset: exterior-wood-trim-probe-inspection.webp,           heading: "Termite Control",       relevance: specific}
    - {slot: a8be796d, asset: roofline-vent-and-utility-penetration.webp,         heading: "Rodent Control",        relevance: specific}
    - {slot: f76e58d6, asset: mattress-seam-inspection-with-flashlight.webp,        heading: "Bed Bug Control",       relevance: specific}
    - {slot: afcc7a50, asset: under-sink-cabinet-flashlight-check.webp,           heading: "Cockroach Control",     relevance: specific}
