# Image manifest.
#
# Every asset must declare a descriptive filename and alt text before it can be
# uploaded. Alt text describes what is visibly in the frame and asserts no
# business fact -- no company name, no service claim, no location claim --
# because none of those are supplied or approved in the Site Variable Sheet.
#
# All imagery is AI-generated (Google Gemini 2.5 Flash Image) and contains no
# text, logos, branded vehicles, licence plates or identifiable faces, so that
# no image asserts something the variable sheet does not supply.

settings:
  source_dir: "../"          # relative to the project root
  max_width: 1600
  hero_max_width: 2000
  quality: 82
  size_budget_kb: 250

assets:
  - source: A1.jpg
    filename: home-hero-east-county-residential-property.webp
    role: hero
    page: homepage
    alt: >-
      Single-storey stucco home with a tile roof and drought-tolerant
      landscaping below dry hills

  - source: A2.jpg
    filename: technician-inspecting-exterior-foundation-line.webp
    role: cta
    page: homepage
    alt: >-
      Technician crouched at the base of an exterior wall examining the
      foundation line with a flashlight

  - source: A3.jpg
    filename: exterior-wood-trim-probe-inspection.webp
    role: section
    page: homepage
    alt: >-
      Gloved hand holding a probe against weathered painted wood trim beside
      stucco

  - source: A4.jpg
    filename: roofline-vent-and-utility-penetration.webp
    role: section
    page: homepage
    alt: >-
      Exterior roofline vent with a metal screen and a utility conduit running
      down the wall

  # Replaced A5 with a stronger frame: the flashlight beam is actually on the
