# --- CTA band backgrounds ----------------------------------------------------
#
# One generateblocks/element per page uses a placeholder as a CSS background
# rather than an <img>. They carry no alt text because a CSS background is
# decorative. Missed by the media-block pass, which is why they are addressed
# separately here.
backgrounds:
  homepage:
    - {slot: df3ee8b0, asset: technician-inspecting-exterior-foundation-line.webp, heading: "CTA band"}
  about:
    - {slot: d477792a, asset: technician-recording-findings-on-clipboard.webp,     heading: "Call East County Exterminator"}
  service_termite:
    - {slot: b81e63a3, asset: exterior-wood-trim-probe-inspection.webp,            heading: "CTA band"}
  location_lakeside:
    - {slot: ea032f74, asset: inspection-tools-on-a-work-surface.webp,             heading: "CTA band"}
